music_directory     "/mnt/music"
playlist_directory  "/etc/mpd/playlists"
db_file             "/etc/mpd/tag_cache"
state_file          "/etc/mpd/state"
log_file            "syslog"
log_level           "error"
user                "mpd"
bind_to_address     "any"
port                "6600"
auto_update         "yes"
restore_paused      "yes"

audio_output {
    type        "alsa"
    name        "Topping DX5 II"
    device      "hw:0,0"
    mixer_type  "none"
    dop         "yes"
}
